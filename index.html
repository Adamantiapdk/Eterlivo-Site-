<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eterlivo</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      text-align: center;
    }

    .hero {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 40px 20px;
    }

    h1 {
      font-size: 60px;
      margin-bottom: 10px;
      letter-spacing: 4px;
    }

    h2 {
      font-size: 22px;
      font-weight: normal;
      color: #ccc;
      margin-bottom: 30px;
    }

    p {
      max-width: 700px;
      font-size: 18px;
      line-height: 1.6;
      color: #ddd;
    }

    .button {
      margin-top: 30px;
      display: inline-block;
      padding: 14px 28px;
      background: white;
      color: black;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
    }

    .button:hover {
      opacity: 0.8;
    }
  </style>
</head>

<body>

  <section class="hero">
    <h1>ETERLIVO</h1>
    <h2>Epic Fantasy • Upper Middle Grade</h2>

    <p>
      Welcome to the world of Eterlivo.
      A fantasy adventure where history, sport and imagination collide.
    </p>

    <a class="button" href="#">Discover the Book</a>
  </section>

</body>
</html>
