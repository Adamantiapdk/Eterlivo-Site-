<!DOCTYPE html>
<html lang="en">
<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>ETERLIVO</title>


  <!-- FONTS -->

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@500;600;700;800&family=Noto+Serif:wght@500;600;700;800&display=swap"
        rel="stylesheet">


  <style>

    :root {

      --ivory: #f7f3e8;
      --cream: #eee7d8;
      --cream-light: #fbf8f1;

      --brown: #4b2d14;
      --brown-dark: #2f1b0d;

      --gold: #9a7440;
      --gold-light: #c0a06b;

      --text: #40352b;
      --border: #c9baa3;

      --shadow:
        0 8px 25px rgba(75,45,20,0.13);

    }


    * {
      box-sizing: border-box;
      scroll-behavior: smooth;
    }


    body {
      margin: 0;

      background: var(--ivory);

      color: var(--text);

      font-family: "Noto Serif", serif;

      font-weight: 500;

      font-size: 19px;

      line-height: 1.65;
    }


    /* =========================
       INTRO SCREEN
    ========================= */

    #intro-screen {

      position: fixed;
      inset: 0;
      z-index: 99999;

      background:
        radial-gradient(
          circle at center,
          #fffdf7 0%,
          #f7f3e8 55%,
          #eee7d8 100%
        );

      display: flex;

      align-items: center;
      justify-content: center;

      padding: 30px 20px;

      transition:
        opacity 0.7s ease,
        visibility 0.7s ease;
    }


    #intro-screen.intro-hidden {

      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }


   .intro-content {
  text-align: center;

  max-width: 900px;

  width: 100%;

  padding: 0 10px;
}


    /* BALL */

.ball-entry {
  opacity: 0;

  animation:
    ballEntrance 1.5s
    cubic-bezier(0.22, 0.8, 0.25, 1)
    forwards;
}


.intro-ball {
  width: 195px;
  max-width: 50vw;
  display: block;
  margin: 0 auto 20px;

  will-change: transform;

  animation:
    ballIdle 4.2s
    ease-in-out
    1.5s
    infinite;
}


@keyframes ballEntrance {

  from {
    opacity: 0;
    transform:
      translate3d(-260px, 0, 0)
      scale(0.88);
  }

  to {
    opacity: 1;
    transform:
      translate3d(0, 0, 0)
      scale(1);
  }

}

@keyframes ballIdle {

  0%, 100% {
    transform:
      translate3d(0, 0, 0)
      scale(1);
  }

  50% {
    transform:
      translate3d(0, -6px, 0)
      scale(1.02);
  }

}
    /* WELCOME LETTERS */

    .intro-welcome {
  font-family: "Noto Serif", serif;
  font-weight: 800;

  color: var(--brown);

  font-size: clamp(22px, 4.2vw, 40px);

  letter-spacing: 1.5px;

  margin: 0;

  line-height: 1.2;

  white-space: nowrap;
}

    .intro-welcome span {

      display: inline-block;

      opacity: 0;

      transform:
        translateY(20px)
        scale(0.8);

      text-shadow:
        0 0 0 rgba(154,116,64,0);
    }


    .intro-welcome.show span {

      animation:
        revealLetter
        0.45s
        ease
        forwards;
    }


    .intro-welcome .space {

      width: 16px;
    }

.intro-welcome.show span:nth-child(1)  { animation-delay: 0.05s; }
.intro-welcome.show span:nth-child(2)  { animation-delay: 0.10s; }
.intro-welcome.show span:nth-child(3)  { animation-delay: 0.15s; }
.intro-welcome.show span:nth-child(4)  { animation-delay: 0.20s; }
.intro-welcome.show span:nth-child(5)  { animation-delay: 0.25s; }
.intro-welcome.show span:nth-child(6)  { animation-delay: 0.30s; }
.intro-welcome.show span:nth-child(7)  { animation-delay: 0.35s; }

.intro-welcome.show span:nth-child(8)  { animation-delay: 0.40s; }

.intro-welcome.show span:nth-child(9)  { animation-delay: 0.45s; }
.intro-welcome.show span:nth-child(10) { animation-delay: 0.50s; }

.intro-welcome.show span:nth-child(11) { animation-delay: 0.55s; }

.intro-welcome.show span:nth-child(12) { animation-delay: 0.60s; }
.intro-welcome.show span:nth-child(13) { animation-delay: 0.65s; }
.intro-welcome.show span:nth-child(14) { animation-delay: 0.70s; }
.intro-welcome.show span:nth-child(15) { animation-delay: 0.75s; }
.intro-welcome.show span:nth-child(16) { animation-delay: 0.80s; }
.intro-welcome.show span:nth-child(17) { animation-delay: 0.85s; }
.intro-welcome.show span:nth-child(18) { animation-delay: 0.90s; }
.intro-welcome.show span:nth-child(19) { animation-delay: 0.95s; }
    @keyframes revealLetter {

      0% {
        opacity: 0;

        transform:
          translateY(20px)
          scale(0.8);

        text-shadow:
          0 0 0
          rgba(154,116,64,0);
      }

      65% {
        opacity: 1;

        transform:
          translateY(-3px)
          scale(1.05);

        text-shadow:
          0 0 14px
          rgba(154,116,64,0.30);
      }

      100% {
        opacity: 1;

        transform:
          translateY(0)
          scale(1);

        text-shadow:
          0 0 0
          rgba(154,116,64,0);
      }
    }


    /* TAGLINE + LANGUAGE INTRO */

    .intro-tagline {

      font-family: "Noto Serif", serif;

      font-weight: 700;

      color: var(--gold);

      font-size: 22px;

      margin: 14px 0 26px;

      opacity: 0;

      transform:
        translateY(12px);
    }


    .intro-tagline.show {

      animation:
        fadeUp
        0.7s
        ease
        forwards;
    }


    .intro-language-title {

      font-family: "Noto Sans", sans-serif;

      font-weight: 600;

      color: #655544;

      font-size: 17px;

      margin-bottom: 18px;

      opacity: 0;

      transform:
        translateY(12px);
    }


    .intro-language-title.show {

      animation:
        fadeUp
        0.7s
        ease
        forwards;
    }


    .intro-languages {

      display: flex;

      justify-content: center;

      flex-wrap: wrap;

      gap: 12px;

      opacity: 0;

      transform:
        translateY(12px);
    }


    .intro-languages.show {

      animation:
        fadeUp
        0.7s
        ease
        forwards;
    }


    @keyframes fadeUp {

      from {
        opacity: 0;
        transform: translateY(12px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }


    .intro-language-button {

      min-width: 130px;

      padding: 13px 22px;

      background: transparent;

      color: var(--brown);

      border:
        1px solid var(--gold);

      border-radius: 7px;

      cursor: pointer;

      font-family: "Noto Sans", sans-serif;

      font-weight: 700;

      font-size: 13px;

      transition:
        background 0.25s,
        color 0.25s,
        transform 0.25s;
    }


    .intro-language-button:hover {

      background: var(--brown);

      color: var(--ivory);

      transform:
        translateY(-2px);
    }


    /* =========================
       NAVIGATION
    ========================= */

    nav {

      position: sticky;

      top: 0;

      z-index: 1000;

      display: flex;

      justify-content: space-between;

      align-items: center;

      padding:
        14px 5%;

      background:
        rgba(247,243,232,0.96);

      backdrop-filter:
        blur(8px);

      border-bottom:
        1px solid var(--border);
    }


    .logo {

      font-family: "Noto Serif", serif;

      font-weight: 800;

      color: var(--brown);

      letter-spacing: 4px;

      font-size: 23px;
    }


    .menu {

      display: flex;

      align-items: center;

      gap: 19px;
    }


    nav a {

      color: var(--brown);

      text-decoration: none;

      font-family: "Noto Sans", sans-serif;

      font-weight: 800;

      font-size: 15px;

      letter-spacing: 0.7px;
    }


    nav a:hover {

      color: var(--gold);
    }


    /* =========================
       LANGUAGE MENU
    ========================= */

    .language-menu {

      margin-left: 8px;
    }


    .language-menu button {

      border:
        1px solid var(--gold);

      background: transparent;

      color: var(--brown);

      padding:
        6px 9px;

      margin-left: 3px;

      border-radius: 5px;

      cursor: pointer;

      font-family: "Noto Sans", sans-serif;

      font-weight: 700;

      font-size: 10px;
    }


    .language-menu button:hover,
    .language-menu button.active {

      background: var(--brown);

      color: var(--ivory);
    }


    /* =========================
       HERO
    ========================= */

    .hero {

      min-height: 92vh;

      display: flex;

      justify-content: center;

      align-items: center;

      text-align: center;

      padding:
        100px 25px 80px;

      background:
        radial-gradient(
          circle at center,
          #fffdf7 0%,
          #f7f3e8 55%,
          #eee7d8 100%
        );
    }


    .hero-content {

      max-width: 900px;
    }


    h1 {

      margin: 0;

      font-family: "Noto Serif", serif;

      font-weight: 800;

      font-size:
        clamp(50px, 9vw, 92px);

      letter-spacing: 7px;

      color: var(--brown);
    }


    .main-tagline {

      margin-top: 20px;

      font-family: "Noto Serif", serif;

      font-weight: 700;

      font-size:
        clamp(19px, 3vw, 29px);

      color: var(--gold);
    }


    .subtitle {

      margin-top: 16px;

      font-family: "Noto Serif", serif;

      font-weight: 600;

      font-size: 20px;

      font-style: italic;

      color: #766452;
    }


    .hero-description {

      max-width: 720px;

      margin:
        35px auto 0;

      font-family: "Noto Serif", serif;

      font-weight: 500;

      font-size: 23px;
    }


    /* =========================
       BUTTONS
    ========================= */

    .hero-buttons {

      margin-top: 42px;
    }


    .button {

      display: inline-block;

      margin: 6px;

      padding:
        12px 25px;

      border:
        1px solid var(--brown);

      border-radius: 6px;

      color: var(--brown);

      text-decoration: none;

      font-family: "Noto Sans", sans-serif;

      font-weight: 700;

      font-size: 13px;

      transition: 0.2s;
    }


    .button:hover {

      background: var(--brown);

      color: var(--ivory);
    }


    .button-primary {

      background: var(--brown);

      color: var(--ivory);
    }


    .button-primary:hover {

      background: var(--gold);

      border-color: var(--gold);
    }


    /* =========================
       SECTIONS
    ========================= */

    section.content-section {

      max-width: 1100px;

      margin: auto;

      padding:
        90px 25px;
    }


    .section-heading {

      text-align: center;

      margin-bottom: 45px;
    }


    .section-heading h2 {

      margin: 0;

      font-family: "Noto Serif", serif;

      font-weight: 800;

      color: var(--brown);

      font-size:
        clamp(30px, 5vw, 43px);
    }


    .section-intro {

      max-width: 800px;

      margin:
        18px auto 0;

      text-align: center;

      font-family: "Noto Serif", serif;

      font-weight: 500;

      font-size: 21px;

      color: #655544;
    }


 
    /* =========================
       CHAPTERS
    ========================= */

    .chapter-list {

      max-width: 850px;

      margin:
        40px auto 0;
    }


    details {

      background:
        var(--cream-light);

      border:
        1px solid var(--border);

      border-radius: 14px;

      margin-bottom: 15px;

      box-shadow:
        0 4px 15px
        rgba(75,45,20,0.07);
    }


    summary {

      cursor: pointer;

      padding:
        21px 24px;

      font-family: "Noto Serif", serif;

      font-weight: 700;

      color: var(--brown);

      font-size: 16px;
    }


    details p {

      margin: 0;

      padding:
        0 25px 25px;

      font-family: "Noto Serif", serif;

      font-weight: 500;

      color: #5b4b3e;
    }


    /* =========================
       SAMPLE
    ========================= */

    .sample-paper {

      max-width: 800px;

      margin:
        40px auto 0;

      background:
        #fffdf8;

      border:
        1px solid var(--border);

      padding:
        clamp(28px, 6vw, 60px);

      box-shadow:
        var(--shadow);
    }


    .sample-paper h3 {

      text-align: center;

      font-family: "Noto Serif", serif;

      font-weight: 800;

      color: var(--brown);

      font-size: 25px;
    }


    .sample-paper p {

      text-align: justify;

      font-family: "Noto Serif", serif;

      font-weight: 500;
    }


    .sample-paper
    p:first-of-type::first-letter {

      float: left;

      font-family: "Noto Serif", serif;

      font-weight: 800;

      font-size: 67px;

      line-height: 0.8;

      padding-right: 9px;

      color: var(--gold);
    }


    /* =========================
       CONTACT
    ========================= */

    .contact-section {

      background: var(--cream);

      border-top:
        1px solid var(--border);

      border-bottom:
        1px solid var(--border);

      text-align: center;

      padding:
        90px 25px;
    }


    .contact-section h2 {

      font-family: "Noto Serif", serif;

      font-weight: 800;

      color: var(--brown);

      font-size: 38px;
    }


    .contact-section p {

      font-family: "Noto Serif", serif;

      font-weight: 500;
    }


    footer {

      text-align: center;

      padding:
        35px 20px;

      color: #83715d;

      font-family: "Noto Sans", sans-serif;

      font-size: 14px;
    }


    /* =========================
       GREEK
    ========================= */

    html[lang="gr"] body {

      font-weight: 600;
    }


    html[lang="gr"] h1,
    html[lang="gr"] .section-heading h2,
    html[lang="gr"] .contact-section h2,
    html[lang="gr"] .card h3,
    html[lang="gr"] summary {

      font-weight: 800;
    }


    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 800px) {
      .intro-welcome {
  font-size: 18px;
  letter-spacing: 0;
  white-space: nowrap;
}
      @media (max-width: 420px) {

  .intro-welcome {
    font-size: 16px;
    letter-spacing: 0;
  }

}

      nav {

        position: relative;

        flex-direction: column;

        gap: 13px;
      }


      .menu {

        flex-wrap: wrap;

        justify-content: center;

        gap: 11px;
      }


      nav a {

        font-size: 12px;
      }


      .language-menu {

        width: 100%;

        text-align: center;

        margin:
          7px 0 0;
      }


      .hero {

        min-height: 80vh;

        padding-top: 70px;
      }


      .hero-description {

        font-size: 20px;
      }


      .intro-ball {

        width: 160px;
      }


      .intro-language-button {

        width: 100%;

        max-width: 240px;
      }


      .intro-welcome {

        letter-spacing: 1px;
      }

    }
/* =========================
   PITCH FLIPBOOK
========================= */

.pitch-modal {
  position: fixed;
  inset: 0;
  z-index: 999999;

  background: rgba(28, 19, 12, 0.92);

  display: none;

  align-items: center;
  justify-content: center;

  padding: 20px;

  overflow: auto;
}

.pitch-modal.open {
  display: flex;
}

.pitch-modal-inner {
  position: relative;

  width: min(1200px, 100%);
  min-height: 90vh;

  display: flex;
  flex-direction: column;

  align-items: center;
  justify-content: center;

  background: #efe9dd;

  border-radius: 18px;

  padding: 55px 20px 25px;

  box-shadow:
    0 20px 60px rgba(0,0,0,0.4);
}

.pitch-close {
  position: absolute;

  top: 14px;
  right: 18px;

  width: 44px;
  height: 44px;

  border: none;
  border-radius: 50%;

  background: var(--brown);
  color: var(--ivory);

  font-size: 28px;

  cursor: pointer;

  line-height: 1;
}

.pitch-close:hover {
  background: var(--gold);
}

.pitch-book-header {
  width: 100%;

  display: flex;
  justify-content: center;
  align-items: center;

  gap: 20px;

  flex-wrap: wrap;

  margin-bottom: 15px;

  color: var(--brown);
}

.pitch-book-header h2 {
  margin: 0;

  font-family: "Noto Serif", serif;
  font-weight: 800;

  font-size:
    clamp(20px, 3vw, 30px);
}

#pitch-page-counter {
  font-family: "Noto Sans", sans-serif;
  font-weight: 700;

  color: var(--gold);
}

.pitch-book-area {
  width: 100%;

  display: flex;
  align-items: center;
  justify-content: center;

  gap: 15px;

  min-width: 0;
}

#pitch-book {
  margin: 0 auto;
}
#pitch-book img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  image-rendering: auto;
}
.pitch-arrow {
  width: 48px;
  height: 48px;

  flex: 0 0 auto;

  border: 1px solid var(--gold);
  border-radius: 50%;

  background: var(--cream-light);
  color: var(--brown);

  font-size: 32px;

  cursor: pointer;

  display: flex;
  align-items: center;
  justify-content: center;

  transition:
    background 0.2s,
    color 0.2s,
    transform 0.2s;
}

.pitch-arrow:hover {
  background: var(--brown);
  color: var(--ivory);

  transform: scale(1.05);
}

.pitch-mobile-hint {
  margin-top: 14px;

  font-family: "Noto Sans", sans-serif;

  font-size: 13px;

  color: #7b6957;

  text-align: center;
}

@media (max-width: 700px) {

  .pitch-modal {
    padding: 8px;
  }

  .pitch-modal-inner {
    min-height: 96vh;

    padding:
      55px 5px 20px;

    border-radius: 10px;
  }

  .pitch-book-area {
    gap: 4px;
  }

  .pitch-arrow {
    width: 38px;
    height: 38px;

    font-size: 25px;
  }

  .pitch-book-header h2 {
    font-size: 18px;
  }

}
  /* =========================
   MOBILE FULLSCREEN BOOK
========================= */

.mobile-book-modal {
  position: fixed;
  inset: 0;

  z-index: 1000000;

  display: none;

  align-items: center;
  justify-content: center;

  background: #17110d;

  overflow: hidden;
}

.mobile-book-modal.open {
  display: flex;
}
#mobile-book {
  width: 100vw;
  height: 100vh;

  display: flex;
  align-items: center;
  justify-content: center;

  overflow: hidden;
}
   
.mobile-book-close {
  position: fixed;

  top: 14px;
  right: 14px;

  z-index: 1000002;

  width: 42px;
  height: 42px;

  border: none;
  border-radius: 50%;

  background: rgba(47, 27, 13, 0.88);

  color: white;

  font-size: 27px;
  line-height: 1;

  cursor: pointer;
}

.mobile-book-counter {
  position: fixed;

  bottom: 14px;
  left: 50%;

  transform: translateX(-50%);

  z-index: 1000002;

  padding: 6px 12px;

  border-radius: 20px;

  background: rgba(47, 27, 13, 0.78);

  color: white;

  font-family: "Noto Sans", sans-serif;

  font-size: 12px;
  font-weight: 700;
}

@media (min-width: 951px) {
  .mobile-book-modal {
    display: none !important;
  }

}
    @media (max-width: 700px) and (orientation: landscape) {

  #mobile-book {
    width: 100vw;
    height: 100vh;
  }

  .mobile-book-close {
    top: 8px;
    right: 8px;
  }

  .mobile-book-counter {
    bottom: 8px;
  }
}
    /* Rotate hint */

.mobile-rotate-hint {
  position: fixed;
  left: 50%;
  bottom: 70px;
  transform: translateX(-50%);
  z-index: 1000003;

  padding: 10px 16px;

  border-radius: 20px;

  background: rgba(47, 27, 13, 0.88);
  color: white;

  font-family: "Noto Sans", sans-serif;
  font-size: 13px;
  font-weight: 700;

  white-space: nowrap;
}


/* Portrait */

@media (max-width: 700px) and (orientation: portrait) {

  #mobile-book {
    width: 100vw;
    height: 100vh;
  }

}


/* Landscape */

@media (max-width: 950px) and (orientation: landscape) {

  .mobile-book-modal {
    overflow: hidden;
    align-items: center;
    justify-content: center;
  }

  #mobile-book {
    width: 92vw;
    height: 92vh;
    margin: auto;
    overflow: hidden;
  }

  .mobile-rotate-hint {
    display: none;
  }

  .mobile-book-close {
    top: 8px;
    right: 8px;
  }

  .mobile-book-counter {
    bottom: 8px;
  }
}
    /* =========================
   HEYZINE PITCH EMBED
========================= */

.heyzine-wrapper {
  width: min(1200px, 96vw);
  height: min(760px, 88vh);

  margin: 0 auto;

  border-radius: 14px;
  overflow: hidden;

  background: #17110d;

  box-shadow:
    0 18px 50px rgba(0, 0, 0, 0.35);
}

.heyzine-wrapper iframe {
  width: 100%;
  height: 100%;

  display: block;

  border: none;
}

@media (max-width: 800px) {

  .pitch-modal {
    padding: 0;
  }

  .pitch-modal-inner {
    position: fixed;
    inset: 0;

    width: 100vw;
    height: 100dvh;
    min-height: 0;

    padding: 0;

    border-radius: 0;

  document.body.style.overflow =
    "hidden";


  function changeLanguage(
    lang,
    button = null
  ) {

    const elements =
      document.querySelectorAll(
        '[data-' + lang + ']'
      );


    elements.forEach(
      function(element) {

        element.innerHTML =
          element.getAttribute(
            'data-' + lang
          );

      }
    );


    document.documentElement.lang =
      lang;


    localStorage.setItem(
      'eterlivo-language',
      lang
    );


    document
      .querySelectorAll(
        '.language-menu button'
      )
      .forEach(
        function(btn) {

          btn.classList.remove(
            'active'
          );

        }
      );


    if (button) {

      button.classList.add(
        'active'
      );

    }

  }



  function enterEterlivo(lang) {

    changeLanguage(lang);


    const intro =
      document.getElementById(
        "intro-screen"
      );


    intro.classList.add(
      "intro-hidden"
    );


    document.body.style.overflow =
      "auto";


    setTimeout(
      function() {

        intro.style.display =
          "none";

      },
      750
    );

  }



  window.addEventListener(
    "load",
    function () {

      const introTitle =
        document.getElementById(
          "intro-title"
        );

        document.getElementById(
          "intro-tagline"
        );

          "intro-language-title"
        );

      const introLanguages =

          "intro-languages"
        );


    introTitle.classList.add("show");


      setTimeout(
        function () {

        },

            .add("show");

        1950
      );


      setTimeout(
        function () {

          introLanguages

            .add("show");

        },
        2200
      );

    }
  );

];

function getPitchImages() {
  const lang = document.documentElement.lang;

  if (lang === "de") {
    return pitchImagesDE;
  }

  return pitchImagesEN;
}


const pitchModal =
  document.getElementById("pitch-modal");

const openPitchButton =
  document.getElementById("open-pitch");

const closePitchButton =
  document.getElementById("close-pitch");


function openPitchBook(event) {

  if (event) {
    event.preventDefault();
  }

  pitchModal.classList.add("open");

  document.body.style.overflow = "hidden";
}


function closePitchBook() {

  pitchModal.classList.remove("open");

  document.body.style.overflow = "auto";
}


if (closePitchButton) {

  closePitchButton.addEventListener(
    "click",
    closePitchBook
  );

}


pitchModal.addEventListener(
  "click",
  function(event) {

    if (event.target === pitchModal) {
      closePitchBook();
    }

  }
);


document.addEventListener(
  "keydown",
  function(event) {

    if (
      event.key === "Escape" &&
      pitchModal.classList.contains("open")
    ) {
      closePitchBook();
    }

  }
);
/* =========================
   MOBILE FULLSCREEN BOOK
========================= */

const mobileBookModal =
  document.getElementById("mobile-book-modal");

const mobileBookElement =
  document.getElementById("mobile-book");

const mobileBookClose =
  document.getElementById("mobile-book-close");

const mobileBookCounter =
  document.getElementById("mobile-book-counter");

let mobilePageFlip = null;


function isMobilePitchView() {
  return window.innerWidth <= 950;
}


function createMobileBook() {

  if (mobilePageFlip) {
    mobilePageFlip.destroy();
    mobilePageFlip = null;
    mobileBookElement.innerHTML = "";
  }

  const images = getPitchImages();

  mobilePageFlip = new St.PageFlip(
    mobileBookElement,
    {
   width: 1200,
height: 675,

size: "stretch",

minWidth: 320,
maxWidth: 1200,

minHeight: 180,
maxHeight: 675,

      showCover: true,
usePortrait: true,
autoSize: true,

      mobileScrollSupport: false,

      maxShadowOpacity: 0.45,

      flippingTime: 750
    }
  );

  mobilePageFlip.loadFromImages(images);

  mobileBookCounter.textContent =
    "1 / " + images.length;

  mobilePageFlip.on(
    "flip",
    function(event) {

      mobileBookCounter.textContent =
        (Number(event.data) + 1) +
        " / " +
        images.length;

    }
  );
}

function openMobileBook() {

  mobileBookModal.classList.add("open");

  document.body.style.overflow = "hidden";

  setTimeout(function() {
    createMobileBook();
  }, 80);
}


function closeMobileBook() {

  mobileBookModal.classList.remove("open");

  document.body.style.overflow = "auto";

  if (mobilePageFlip) {
    mobilePageFlip.destroy();
    mobilePageFlip = null;
    mobileBookElement.innerHTML = "";
  }
}


mobileBookClose.addEventListener(
  "click",
  closeMobileBook
);
 
 
 
</script>
